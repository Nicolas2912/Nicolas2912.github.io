<footer class="site-footer">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
    <p class="mb-0">© {{ site.time | date: '%Y' }} {{ site.author }} · {{ t.footer.tagline }}</p>
    <ul class="footer-links list-unstyled mb-0">
      <li><a href="mailto:{{ site.email }}"><i class="bi bi-envelope" aria-hidden="true"></i> {{ t.footer.email }}</a></li>
      <li><a href="https://www.linkedin.com/in/nicolas-schneider1/" target="_blank" rel="noopener"><i class="bi bi-linkedin" aria-hidden="true"></i> LinkedIn</a></li>
      <li><a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener"><i class="bi bi-github" aria-hidden="true"></i> GitHub</a></li>
      <li><a href="{{ '/feed.xml' | relative_url }}"><i class="bi bi-rss" aria-hidden="true"></i> RSS</a></li>
    </ul>
  </div>
</footer>
