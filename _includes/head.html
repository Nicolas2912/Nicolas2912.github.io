<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Enhanced SEO Meta Tags -->
  <meta name="robots" content="index, follow">
  <meta name="author" content="{{ site.author | default: site.title }}">
  
  <!-- Jekyll SEO Plugin (generates meta description, Open Graph, Twitter Cards, etc.) -->
  {%- seo -%}
  {%- if has_translation %}
  <link rel="alternate" hreflang="{{ lang }}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{{ other_lang }}" href="{{ alt_url | absolute_url }}">
  {%- if lang == "en" %}
  <link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
  {%- else %}
  <link rel="alternate" hreflang="x-default" href="{{ alt_url | absolute_url }}">
  {%- endif %}
  {%- endif %}
  
  <!-- Apply the saved theme before styles paint, even when storage is unavailable. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (error) {}
      var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark-mode', dark);
    })();
  </script>

  <!-- Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/css/syntax.css" | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ "/css/style.css" | relative_url }}?v={{ site.time | date: '%s' }}">

  {% if page.mathjax or site.mathjax %}
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}
  
  <!-- Feed and Analytics -->
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
