{%- include lang.html -%}
<header class="page-header">
  <h1>{{ t.blog.title }}</h1>
  <p class="lead">{{ t.blog.intro }}</p>
</header>
{% assign posts = site.posts | where: "lang", lang %}
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  {% for post in posts %}
    <div class="col">
      <article class="card h-100 post-card">
        <div class="card-body d-flex flex-column">
          <p class="card-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: t.date_format }}</time></p>
          <h2 class="card-title h5">
            <a href="{{ post.url | relative_url }}" class="stretched-link text-decoration-none">{{ post.title }}</a>
          </h2>
          <p class="card-text">{{ post.description | default: post.excerpt | strip_html | truncate: 220 }}</p>
        </div>
      </article>
    </div>
  {% endfor %}
</div>
