# Site settings
title: Nicolas Schneider - Consultant | Data & AI
email: schneidernicolas90@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Consultant at 4brands Reply working on CRM, integration, analytics, and AI
  with Salesforce Consumer Goods Cloud and Microsoft Azure/Fabric.
  Projects and writing on machine learning, data integration, and AI infrastructure.
baseurl: "" # the subpath of your site is empty for a user site (username.github.io)
url: "https://nicolas2912.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  Nicolas2912 # optional

# SEO and Social Media
author: Nicolas Schneider
# Add a `twitter:` block with `username:` here if you start using X/Twitter.

# Open Graph / Social Media defaults
social:
  name: Nicolas Schneider
  links:
    - https://github.com/Nicolas2912
    - https://www.linkedin.com/in/nicolas-schneider1/

# Default image for social sharing (add this image to your images folder)
logo: /images/profile.jpg
social_image: /images/profile.jpg

# SEO plugin settings
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-redirect-from

# Additional SEO settings
lang: en_US
timezone: Europe/Berlin

# Build settings
theme: minima # A simple default Jekyll theme

# Enable syntax highlighting for code blocks using Rouge
markdown: kramdown
highlighter: rouge

# Kramdown settings for GitHub Flavored Markdown and Rouge syntax highlighting
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
  math_engine: mathjax
  math_engine_opts:
    tex: {}

# Collections for Projects
collections:
  projects:
    output: true # Tells Jekyll to create a page for each project file
    permalink: /projects/:name/ # Sets the URL structure for project pages
  work:
    output: true # Anonymized case studies from client and internal work
    permalink: /work/:name/

# Languages: English is the default; German pages live under /de/ and in de/ subfolders
# of the collections. Pages in both languages are linked by `ref` (or by the same file name).
defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: "de"
    values:
      lang: de
      locale: de_DE
  - scope:
      path: "_work/de"
    values:
      lang: de
      locale: de_DE
  - scope:
      path: "_projects/de"
    values:
      lang: de
      locale: de_DE
  - scope:
      path: "_posts/de"
    values:
      lang: de
      locale: de_DE

# Exclude from the built site. On Jekyll 3.x (GitHub Pages) this list replaces
# the defaults, so the default entries are repeated here.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
  - CV/build_cv.py
  - CV/assets/
  - obsidian-work/
