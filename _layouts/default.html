<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    <!-- Dark background div that sits behind everything -->
    <div id="theme-background"></div>
    {% if page.url == "/" %}
      <div id="particles-js"></div>
    {% endif %}

    {% include navbar.html %}
    <div class="container mt-5">
      {{ content }}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="{{ '/js/scroll-animations.js' | relative_url }}"></script>
    <script src="{{ '/js/page-transitions.js' | relative_url }}"></script>
    <script src="{{ '/js/theme.js' | relative_url }}"></script>
    <script>
      // Keep one particle canvas alive across theme changes.
      if (document.getElementById('particles-js') && window.tsParticles) {
          const options = {
            particles: {
              number: { value: 40, density: { enable: true, area: 800 } },
              color: { value: '#64b5f6' },
              shape: { type: 'circle' },
              opacity: { value: 0.6 },
              size: { value: 3, random: true },
              links: { enable: true, distance: 150, color: '#64b5f6', opacity: 0.6, width: 1 },
              move: { enable: true, speed: 1, outModes: { default: 'out' } }
            },
            interactivity: {
              // Listen for pointer events on the window so canvas floats visually behind content
              detectsOn: 'window',
              events: {
                onHover: { enable: true, mode: 'grab' },
                onClick: { enable: false },
                resize: true
              },
              modes: {
                grab: { distance: 200, links: { opacity: 0.6 } }
              }
            },
            detectRetina: true
          };
        tsParticles.load('particles-js', options).catch(() => {});
        document.getElementById('particles-js').style.display = 'block';
      }
    </script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Copy button for code blocks
        document.querySelectorAll('pre').forEach(function(pre) {
          pre.style.position = 'relative';
          var btn = document.createElement('button');
          btn.className = 'copy-button';
          btn.type = 'button';
          btn.innerText = 'Copy';
          pre.appendChild(btn);
          btn.addEventListener('click', function() {
            var code = pre.querySelector('code');
            var text = code ? code.innerText : pre.innerText;
            navigator.clipboard.writeText(text).then(function() {
              btn.innerText = 'Copied!';
              setTimeout(function() { btn.innerText = 'Copy'; }, 2000);
            });
          });
        });
      });
    </script>
  </body>
</html>
