- title: "Benchmarking a local AI workstation"
  area: "AI infrastructure"
  text: "Set up a desktop AI system with vLLM behind an OpenAI-compatible gateway and measured throughput, tool calling, and fine-tuning, reaching 255 tokens/s at 100 parallel requests. A QLoRA fine-tune lowered accuracy, so I recommended the base model."
  tech: [vLLM, LiteLLM, Docker, Grafana, QLoRA]
  status: "Done · internal"
