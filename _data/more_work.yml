- title: "Prioritizing store visits with data"
  area: "Optimization · ML"
  text: "Backtested a risk model that decides which store visits get extra preparation time. With the same 20% capacity, it reached about 597 more at-risk visits than random selection (precision 88.5% vs. a 49.4% base rate, ROC-AUC 0.813)."
  tech: [Machine learning, Backtesting, Mixed-integer optimization]
  status: "Analysis · not deployed"
  de:
    title: "Marktbesuche datenbasiert priorisieren"
    area: "Optimierung · ML"
    text: "Ein Risikomodell im Backtest geprüft, das entscheidet, welche Marktbesuche zusätzliche Vorbereitungszeit bekommen. Bei gleicher Kapazität von 20 % erreichte es rund 597 Risikobesuche mehr als eine Zufallsauswahl (Precision 88,5 % bei einer Grundrate von 49,4 %, ROC-AUC 0,813)."
    status: "Analyse · nicht im Einsatz"

